# True Color Support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s set-clipboard on
set -g allow-passthrough on

# Change prefix to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Set vi-mode
set-window-option -g mode-keys vi

# Keybindings for yanking
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# Custom Split Window Bindings
bind / split-window -h
bind - split-window -v

# Direct multiplexer actions. Ctrl+Alt is free of the existing WezTerm and
# Hyprland bindings; Ctrl+Space prefix actions above remain unchanged.
bind-key -n C-M-c new-window
bind-key -n C-M-, command-prompt -p "rename-tab:" "rename-window '%%'"
bind-key -n C-M-/ split-window -h
bind-key -n C-M-? split-window -h
bind-key -n C-M-- split-window -v
bind-key -n C-M-_ split-window -v
bind-key -n C-M-p previous-window
bind-key -n C-M-n next-window
bind-key -n C-M-h select-pane -L
bind-key -n C-M-j select-pane -D
bind-key -n C-M-k select-pane -U
bind-key -n C-M-l select-pane -R

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @yank_selection 'clipboard'

# Tmux Resurrect & Continuum Configuration
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Dracula theme settings
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon session
set -g @dracula-plugins "git time"
set -g @dracula-git-colors "dark_purple cyan"
set -g @dracula-time-colors "dark_gray white"
set -g @dracula-show-left-sep 
set -g @dracula-show-right-sep 
set-option -g status-position bottom

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
