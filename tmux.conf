# True Color Support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s set-clipboard on
set -g allow-passthrough on

# Change prefix to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Set vi-mode
set-window-option -g mode-keys vi

# Keybindings for yanking
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# Custom Split Window Bindings
bind / split-window -h
bind - split-window -v

# Remove the former direct layer when reloading an existing server.
unbind-key -n C-M-S-t
unbind-key -n C-M-S-/
unbind-key -n C-M-S-?
unbind-key -n C-M-S--
unbind-key -n C-M-S-_
unbind-key -n C-M-S-PageUp
unbind-key -n C-M-S-PageDown
unbind-key -n C-M-S-Left
unbind-key -n C-M-S-Down
unbind-key -n C-M-S-Up
unbind-key -n C-M-S-Right

# Match herdr/config.toml: tmux windows are tabs, sessions are workspaces.
bind d detach-client
bind T new-window
bind W new-session
bind . command-prompt -I '#S' 'rename-session -- "%%"'
bind , command-prompt -I '#W' 'rename-window -- "%%"'
bind P previous-window
bind N next-window
bind S-Left select-pane -L
bind S-Down select-pane -D
bind S-Up select-pane -U
bind S-Right select-pane -R

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @yank_selection 'clipboard'

# Tmux Resurrect & Continuum Configuration
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Rose Pine theme settings (uses the terminal's existing Nerd Font).
set -g @rose_pine_variant 'moon'
# Native Moon layout and Nerd Font modules, without repeating the prompt clock.
set -gu @rose_pine_bar_bg_disable
set -gu @rose_pine_bar_bg_disabled_color_option
set -gu @rose_pine_disable_active_window_menu
set -gu @rose_pine_status_right_prepend_section
set -g @rose_pine_host 'on'
set -g @rose_pine_hostname_short 'on'
set -g @rose_pine_user 'on'
set -g @rose_pine_directory 'on'
set -g @rose_pine_date_time ''
set-option -g status-position bottom

# Load upstream plugins before the small Mero-specific visual overrides.
run '~/.tmux/plugins/tpm/tpm'

# One quiet Moon color for all dividers, without a bright focus accent.
set -g pane-border-lines single
set -g pane-border-style 'fg=#393552,bg=default'
set -g pane-active-border-style 'fg=#393552,bg=default'
