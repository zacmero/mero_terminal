# Mero Terminal Herdr configuration.
# Keep the user-owned configuration in the repository so every installation
# shares the same prefix and detach behavior.

onboarding = false

[update]
channel = "stable"

[keys]
# Keep Ctrl+Space as the prefix; these actions use the prefix plus Shift.
prefix = "ctrl+space"
detach = "prefix+d"
new_tab = "prefix+shift+t"
rename_tab = "prefix+comma"
split_vertical = "prefix+shift+slash"
split_horizontal = "prefix+shift+minus"
previous_tab = "prefix+shift+p"
next_tab = "prefix+shift+n"
focus_pane_left = "prefix+shift+left"
focus_pane_down = "prefix+shift+down"
focus_pane_up = "prefix+shift+up"
focus_pane_right = "prefix+shift+right"

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = false
