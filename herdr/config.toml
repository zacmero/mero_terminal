# Mero Terminal Herdr configuration.
# Keep the user-owned configuration in the repository so every installation
# shares the same prefix and detach behavior.

onboarding = false

[update]
channel = "stable"

[keys]
# Use a short second layer that is less likely to be intercepted by the
# terminal emulator, desktop, shell, or editor.
prefix = "shift+tab"
detach = "prefix+d"
new_tab = "prefix+t"
rename_tab = "prefix+comma"
split_vertical = "prefix+slash"
split_horizontal = "prefix+minus"
previous_tab = "prefix+p"
next_tab = "prefix+n"
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = false
