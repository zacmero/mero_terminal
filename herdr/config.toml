# Mero Terminal Herdr configuration.
# Keep the user-owned configuration in the repository so every installation
# shares the same prefix and detach behavior.

onboarding = false

[update]
channel = "stable"

[keys]
# Keep Ctrl+Space as the canonical Herdr prefix, matching tmux.
prefix = "ctrl+space"
detach = "prefix+d"
# Retain prefix bindings and add direct Ctrl+Alt actions. This family survives
# WezTerm and Hyprland without stealing Ctrl+Shift terminal shortcuts.
new_tab = ["prefix+t", "ctrl+alt+c"]
rename_tab = ["prefix+comma", "ctrl+alt+comma"]
split_vertical = ["prefix+slash", "ctrl+alt+slash"]
split_horizontal = ["prefix+minus", "ctrl+alt+minus"]
previous_tab = ["prefix+p", "ctrl+alt+p"]
next_tab = ["prefix+n", "ctrl+alt+n"]
focus_pane_left = ["prefix+left", "ctrl+alt+h"]
focus_pane_down = ["prefix+down", "ctrl+alt+j"]
focus_pane_up = ["prefix+up", "ctrl+alt+k"]
focus_pane_right = ["prefix+right", "ctrl+alt+l"]

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = false
