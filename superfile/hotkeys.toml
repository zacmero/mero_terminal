# Mero Terminal Superfile hotkeys.
# Navigation stays Vim-like, while file operations avoid ambiguous Ctrl keys.
# This prevents Ctrl+C/X/V/D/W from fighting normal terminal and tmux habits.

# Global hotkeys
confirm = ['enter', 'right', 'l']
cd_quit = ['Q', '']
quit = ['q', 'esc']
list_down = ['down', 'j']
list_up = ['up', 'k']
page_down = ['pgdown', '']
page_up = ['pgup', '']

# File panel controls
close_file_panel = ['ctrl+shift+w', '']
create_new_file_panel = ['ctrl+shift+n', '']
next_file_panel = ['tab', '']
open_sort_options_menu = ['o', '']
pinned_directory = ['P', '']
previous_file_panel = ['shift+tab', '']
split_file_panel = ['N', '']
toggle_file_preview_panel = ['f', '']
toggle_reverse_sort = ['R', '']

# Focus manipulation
focus_on_metadata = ['m', '']
focus_on_process_bar = ['p', '']
focus_on_sidebar = ['s', '']

# File and directory creation/renaming
file_panel_item_create = ['ctrl+shift+a', '']
file_panel_item_rename = ['ctrl+shift+r', '']

# Main file operations
# y/p follow Vim's yank/paste convention. Destructive actions require an
# explicit physical Delete or Shift+Delete key instead of Ctrl+D or D.
copy_items = ['y', '']
cut_items = ['X', '']
delete_items = ['delete', '']
paste_items = ['p', '']
permanently_delete_items = ['shift+delete', '']

# Archive manipulation
compress_file = ['C', '']
extract_file = ['E', '']

# Editor actions
open_current_directory_with_editor = ['G', '']
open_file_with_editor = ['e', '']

# Other actions
# M avoids stealing Bash/readline Vim's v command while still being memorable.
change_panel_mode = ['M', '']
copy_path = ['Y', '']
copy_present_working_directory = ['c', '']
open_command_line = [';', '']
open_help_menu = ['?', '']
open_spf_prompt = ['>', '']
open_zoxide = ['z', '']
toggle_dot_file = ['.', '']
toggle_footer = ['F', '']

# Typing hotkeys
confirm_typing = ['enter', '']
cancel_typing = ['ctrl+c', 'esc']

# Mode-specific hotkeys
parent_directory = ['h', 'left', 'backspace']
search_bar = ['/', '']
file_panel_select_mode_items_select_down = ['shift+down', 'J']
file_panel_select_mode_items_select_up = ['shift+up', 'K']
file_panel_select_all_items = ['A', '']
