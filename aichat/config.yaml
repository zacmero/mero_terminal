model: gemini:gemini-2.5-flash-lite
temperature: 0.7
top_p: 0.95

stream: true
save: true
keybindings: vi
editor: nvim
wrap: auto
wrap_code: true

repl_prelude: "role:coder"
serve_addr: 127.0.0.1:8000

# GEMINI_API_KEY is loaded from /opt/mero_terminal/aichat.env via Bash.
document_loaders:
  pdf: "pdftotext $1 -"
