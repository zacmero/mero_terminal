model: openrouter:openrouter/free
temperature: 0.7
top_p: 0.95

stream: true
save: true
keybindings: emacs
editor: nvim
wrap: auto
wrap_code: true

repl_prelude: "role:coder"
serve_addr: 127.0.0.1:8000

# OPENROUTER_API_KEY is loaded from /opt/mero_terminal/aichat.env via Bash.
document_loaders:
  pdf: "pdftotext $1 -"

clients:
  - type: openai-compatible
    name: openrouter
    api_base: https://openrouter.ai/api/v1
    models:
      - name: openrouter/auto
        max_input_tokens: 2000000
        supports_function_calling: true
      - name: openrouter/free
        max_input_tokens: 2000000
        supports_function_calling: true
