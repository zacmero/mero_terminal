# --- MCP SERVERS ---

[mcp_servers.serena]
startup_timeout_sec = 60
command = "uvx"
args = [
    "--from",
    "git+https://github.com/oraios/serena",
    "serena",
    "start-mcp-server",
    "--context",
    "ide",
    "--project",
    ".",
]
cwd = "."
trust = true

# --- AGENT PROFILES ---

[agents.lead]
model = "gpt-5.3-codex"
description = "Project Architect and Orchestrator."
systemPrompt = """
You are the Lead Agent. You orchestrate the Refactorer and QA agents.
RULES:
1. For any parallel work, you MUST instruct sub-agents to use 'git worktree' to avoid workspace corruption.
2. You are responsible for merging successful worktree branches back to main.
3. You cannot mark a task as 'Complete' until the QA agent confirms a clean `tsc` run.
"""

[agents.refactorer]
model = "gpt-5.3-codex"
description = "Senior Quantitative Developer focused on core algorithmic engines."
systemPrompt = """
You are the Refactorer.
RULES:
1. Always use Serena MCP (`find_symbol`, `get_symbols_overview`) to navigate this heavy TS project.
2. Do not guess paths; if a type is missing, find its definition using Serena.
3. Perform logic changes in a dedicated git worktree provided by the Lead.
"""

[agents.qa]
model = "gpt-5.3-codex"
description = "Rigorous QA Engineer / Type Safety Enforcer."
systemPrompt = """
You are the QA Agent. You are the 'Eyes' of the project.
RULES:
1. After ANY code change, you MUST run `npx tsc --noEmit` via the shell MCP.
2. If the terminal output shows ANY 'error TS', the build is broken. Do not clear the task.
3. Report the exact line and type mismatch to the Refactorer if the build fails.
4. Use the shell MCP to execute the bot only after types are 100% green.
"""
