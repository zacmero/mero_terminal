[mcp_servers.serena]
command = "mero-mcp-serena"
args = ["start-mcp-server", "--context", "ide", "--project", ".", "--enable-web-dashboard", "false", "--open-web-dashboard", "false"]
cwd = "."
startup_timeout_sec = 90.0
[mcp_servers.serena.env]
SERENA_HOME = "/tmp/mero-serena"


[mcp_servers.morph-mcp]
command = "mero-mcp-morph"
args = []
startup_timeout_sec = 90.0

[mcp_servers.playwright]
command = "mero-mcp-playwright"
args = []
startup_timeout_sec = 90.0

# Headroom is exposed as an MCP tool only. Raw Codex never uses its local proxy.
[mcp_servers.headroom]
command = "headroom"
args = ["mcp", "serve"]

[mcp_servers.headroom.env]
HEADROOM_PROXY_URL = "http://127.0.0.1:8790"

[mcp_servers.node_repl]
args = []
command = "/usr/lib/chatgpt/resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/usr/lib/chatgpt/resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/home/zacmero/.codex:/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
